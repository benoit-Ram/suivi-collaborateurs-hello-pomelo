name: Build & Deploy to DO

# Build backend + frontend images, push to DO registry, pull + restart on droplet.
# Déclenchement : push sur master (après merge PR) ou manuel.

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com/hello-pomelo
  IMAGE_BACKEND: suivi-collaborateurs-backend
  IMAGE_FRONTEND: suivi-collaborateurs-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DO Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Set tag (git short sha)
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:buildcache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:buildcache,mode=max

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DO Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ needs.build-push.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ needs.build-push.outputs.tag }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

  deploy:
    needs: [build-push, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Trim CR/LF au cas où le secret aurait été posé depuis Windows PowerShell
          HOST=$(echo "${{ secrets.DROPLET_HOST }}" | tr -d '\r\n ')
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Pull & restart stack on droplet (immutable sha tag)
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DROPLET: ${{ secrets.DROPLET_HOST }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          DROPLET=$(echo "$DROPLET" | tr -d '\r\n ')
          ssh -i ~/.ssh/id_deploy root@$DROPLET IMAGE_TAG="$IMAGE_TAG" DO_TOKEN="$DO_TOKEN" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/suivi-collaborateurs
          # Persister le tag courant pour les redémarrages manuels.
          # Garantir une newline terminale AVANT d'ajouter pour éviter la fusion avec la ligne précédente.
          if grep -q '^IMAGE_TAG=' .env 2>/dev/null; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
          else
            [ -s .env ] && [ "$(tail -c1 .env | wc -l)" -eq 0 ] && echo >> .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          # Re-login en cas d'expiration du token docker
          echo "$DO_TOKEN" | docker login registry.digitalocean.com --username "$DO_TOKEN" --password-stdin
          docker compose pull backend frontend
          docker compose up -d --no-deps backend frontend
          docker image prune -f --filter "dangling=true"
          echo "Deploy ${IMAGE_TAG} complete at $(date)"
          EOF

      - name: Smoke test
        run: |
          HOST=$(echo "${{ secrets.DROPLET_HOST }}" | tr -d '\r\n ')
          # Test via la connexion directe au droplet (bypass DNS/Cloudflare) sur le port interne.
          # Retry 6x 10s = 60s max — laisse le temps au backend (DB pool + healthcheck) de monter.
          ssh -i ~/.ssh/id_deploy root@$HOST bash -s <<'EOF'
          for i in 1 2 3 4 5 6; do
            if docker run --rm --network hp_edge curlimages/curl -sSf -m 5 http://frontend/api/health > /tmp/health.json 2>/dev/null; then
              cat /tmp/health.json
              echo ""
              echo "Health check OK (try $i)"
              exit 0
            fi
            echo "try $i: pas prêt, retry dans 10s..."
            sleep 10
          done
          echo "FAIL après 60s"
          docker ps --format 'table {{.Names}}\t{{.Status}}' | head
          docker logs hp-backend --tail=20 2>&1
          exit 1
          EOF
