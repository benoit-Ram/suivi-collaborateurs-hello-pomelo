# Config nginx pour servir le SPA React + Vite build.
# Le proxy /api → backend se fait côté Traefik (une route par container),
# pas ici — ce container ne sert QUE le static frontend.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compression — Vite produit déjà des .gz côté build, nginx preserve
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionnés par Vite (hash dans le nom) → cache long
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback : toute route inconnue sert index.html (React Router gère ensuite)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck trivial pour Docker + Traefik
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Headers sécurité de base (Traefik peut les surcharger si besoin)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
