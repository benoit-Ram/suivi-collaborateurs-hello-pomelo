# Config nginx pour servir le SPA React + Vite build.
# En prod, Traefik gère le routing /api → backend et /* → frontend. En dev
# local (docker-compose), on n'a pas Traefik, donc on proxie /api → backend
# ici pour que l'app soit testable sur un seul port.

upstream hp_backend {
    # Résolution DNS dynamique (le container backend peut redémarrer)
    server backend:4000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* → backend NestJS. Doit être AVANT la location / pour
    # ne pas tomber dans le SPA fallback.
    location /api/ {
        proxy_pass http://hp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Compression — Vite produit déjà des .gz côté build, nginx preserve
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionnés par Vite (hash dans le nom) → cache long
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback : toute route inconnue sert index.html (React Router gère ensuite)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck trivial pour Docker + Traefik
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Headers sécurité de base (Traefik peut les surcharger si besoin)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
