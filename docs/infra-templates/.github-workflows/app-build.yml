# Repo: suivi-collaborateurs-app (ex-suivi-collaborateurs-hello-pomelo, renommé)
# .github/workflows/build.yml
# Build + scan + push images backend et frontend sur registry DO.
# Tag = SHA court du commit. Jamais `latest`.

name: build & push

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  id-token: write # OIDC Infisical

env:
  REGISTRY: registry.digitalocean.com/hp-suivi-collaborateurs

jobs:
  build:
    strategy:
      matrix:
        app: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Credentials registry push via Infisical (robot push, lecture seule sur push)
      - uses: infisical/secrets-action@v3
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_APP_CI_IDENTITY_ID }}
          project-slug: suivi-collaborateurs
          env-slug: prod
          secret-paths: '["/registry/push"]'
          export-type: env

      - name: Docker login
        run: echo "${DO_REGISTRY_PASSWORD}" | docker login ${REGISTRY%/*} -u "${DO_REGISTRY_USERNAME}" --password-stdin

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}

      - name: Trivy scan (VPS-DEP06)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        run: docker push ${{ env.REGISTRY }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}

      - name: Trigger stack deploy preprod
        if: matrix.app == 'backend' # une fois par SHA, pas deux
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.STACK_DISPATCH_TOKEN }} # fine-grained PAT, repo:stack
          repository: benoit-Ram/suivi-collaborateurs-stack
          event-type: new-image
          client-payload: |
            {"tag": "${{ steps.tag.outputs.tag }}", "sha": "${{ github.sha }}"}
